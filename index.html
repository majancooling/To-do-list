<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f7fb;
  color: #172033;
  min-height: 100vh;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
}

.container {
  width: min(100% - 28px, 900px);
  margin: auto;
}

/* AUTH */

.auth {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.auth-card {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 30px;
  border-radius: 24px;
  box-shadow: 0 15px 50px rgba(0,0,0,.08);
  animation: pop .5s ease;
}

.logo {
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 8px;
}

.subtitle {
  color: #737b8c;
  margin-bottom: 25px;
}

input,
select {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid #e1e5ec;
  border-radius: 13px;
  outline: none;
  background: white;
}

input:focus,
select:focus {
  border-color: #6366f1;
}

.field {
  margin-bottom: 14px;
}

.primary {
  width: 100%;
  padding: 14px;
  border-radius: 13px;
  background: #6366f1;
  color: white;
  font-weight: 700;
  transition: .2s;
}

.primary:hover {
  transform: translateY(-2px);
}

.secondary {
  margin-top: 12px;
  width: 100%;
  padding: 13px;
  border-radius: 13px;
  background: #eef0ff;
  color: #5558c9;
  font-weight: 700;
}

.message {
  margin-top: 15px;
  font-size: 14px;
  text-align: center;
}

/* APP */

.app {
  display: none;
  padding: 22px 0 50px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.header h1 {
  font-size: 28px;
}

.logout {
  background: #fff;
  border: 1px solid #e4e7ee;
  padding: 9px 13px;
  border-radius: 11px;
}

/* DASHBOARD */

.dashboard {
  background: white;
  padding: 22px;
  border-radius: 22px;
  box-shadow: 0 8px 30px rgba(0,0,0,.05);
  margin-bottom: 18px;
  animation: slideUp .5s ease;
}

.finished {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.finished strong {
  font-size: 25px;
}

.progress-track {
  height: 13px;
  background: #edf0f5;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#6366f1,#8b5cf6);
  border-radius: 20px;
  transition: width .8s cubic-bezier(.2,.8,.2,1);
}

.percent {
  text-align: right;
  margin-top: 7px;
  color: #777f91;
  font-size: 13px;
}

.targets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 18px;
}

.target {
  background: #f8f9fc;
  padding: 16px;
  border-radius: 17px;
}

.target-title {
  font-weight: 700;
  margin-bottom: 5px;
}

.target-number {
  font-size: 22px;
  font-weight: 800;
}

.target small {
  color: #777f91;
}

.target .progress-track {
  height: 8px;
  margin-top: 10px;
}

/* CONTROLS */

.controls {
  background: white;
  padding: 18px;
  border-radius: 20px;
  margin-bottom: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.04);
}

.add-row {
  display: flex;
  gap: 9px;
}

.add-row input {
  flex: 1;
}

.add-btn {
  padding: 0 18px;
  border-radius: 13px;
  background: #6366f1;
  color: white;
  font-weight: 700;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 10px;
}

/* CATEGORIES */

.category-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 3px 0 12px;
}

.category-btn {
  white-space: nowrap;
  padding: 8px 13px;
  border-radius: 20px;
  background: #f0f1f6;
  color: #555c6d;
}

.category-btn.active {
  background: #6366f1;
  color: white;
}

/* TASKS */

.tasks {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.task {
  background: white;
  padding: 15px;
  border-radius: 17px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 5px 20px rgba(0,0,0,.04);
  animation: taskIn .35s ease;
  transition: transform .2s, opacity .3s;
}

.task:hover {
  transform: translateY(-2px);
}

.check {
  width: 25px;
  height: 25px;
  border-radius: 50%;
  border: 2px solid #cbd0dc;
  background: white;
  flex-shrink: 0;
}

.task.done .check {
  background: #6366f1;
  border-color: #6366f1;
}

.task.done .check::after {
  content: "✓";
  color: white;
  display: block;
  text-align: center;
  line-height: 21px;
  font-size: 14px;
}

.task-title {
  flex: 1;
  font-weight: 600;
}

.task.done .task-title {
  text-decoration: line-through;
  color: #9ba1ad;
}

.category-tag {
  font-size: 11px;
  padding: 5px 8px;
  border-radius: 10px;
  background: #eee;
}

.delete {
  background: transparent;
  color: #a0a5b0;
  font-size: 19px;
}

.delete:hover {
  color: #ef4444;
}

.empty {
  text-align: center;
  padding: 45px 20px;
  color: #858c9b;
}

/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.modal-card {
  background: white;
  width: 100%;
  max-width: 400px;
  padding: 24px;
  border-radius: 22px;
  animation: pop .3s ease;
}

.modal-card h2 {
  margin-bottom: 17px;
}

.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.modal-buttons button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
}

.cancel {
  background: #edf0f5;
}

.save {
  background: #6366f1;
  color: white;
}

/* ANIMATIONS */

@keyframes pop {
  from {
    opacity: 0;
    transform: scale(.94);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes taskIn {
  from {
    opacity: 0;
    transform: translateX(-12px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@media(max-width:600px) {
  .targets {
    grid-template-columns: 1fr;
  }

  .add-row {
    flex-direction: column;
  }

  .add-btn {
    padding: 13px;
  }

  .header h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section class="auth" id="auth">
  <div class="auth-card">
    <div class="logo">TaskFlow ✨</div>
    <p class="subtitle">Organize your day. Reach your goals.</p>

    <div class="field">
      <input id="email" type="email" placeholder="Email">
    </div>

    <div class="field">
      <input id="password" type="password" placeholder="Password">
    </div>

    <button class="primary" onclick="login()">Login</button>
    <button class="secondary" onclick="signup()">Create account</button>

    <div class="message" id="authMessage"></div>
  </div>
</section>


<!-- APP -->

<section class="app" id="app">

<div class="container">

  <header class="header">
    <h1>My Tasks ✨</h1>
    <button class="logout" onclick="logout()">Logout</button>
  </header>


  <!-- DASHBOARD -->

  <div class="dashboard">
    
    <div class="card streak-card">
  <div class="card-icon">🔥</div>
  <div>
    <h3>Current Streak</h3>
    <p><span id="streakCount">0</span> days</p>
  </div>
    </div>

    <div class="finished">
      <div>
        <small>Overall Progress</small>
        <div>
          <strong id="finishedText">0 / 0</strong>
        </div>
      </div>

      <strong id="overallPercent">0%</strong>
    </div>

    <div class="progress-track">
      <div class="progress-bar" id="overallBar"></div>
    </div>


    <div class="targets">

      <div class="target">
        <div class="target-title">🎯 Daily Target</div>

        <div>
          <span class="target-number" id="dailyProgress">0</span>
          <span>/</span>
          <span id="dailyTarget">5</span>
        </div>

        <small>completed today</small>

        <div class="progress-track">
          <div class="progress-bar" id="dailyBar"></div>
        </div>
      </div>


      <div class="target">
        <div class="target-title">📅 Weekly Target</div>

        <div>
          <span class="target-number" id="weeklyProgress">0</span>
          <span>/</span>
          <span id="weeklyTarget">30</span>
        </div>

        <small>completed this week</small>

        <div class="progress-track">
          <div class="progress-bar" id="weeklyBar"></div>
        </div>
      </div>

    </div>

    <button
      class="secondary"
      style="margin-top:15px"
      onclick="openTargetModal()">
      ⚙️ Change Targets
    </button>

  </div>


  <!-- CONTROLS -->

  <div class="controls">

    <div class="add-row">
      <input id="taskInput" placeholder="What do you need to do?">
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>

    <div class="options">

      <select id="categorySelect">
        <option value="">No category</option>
      </select>

      <button
        class="secondary"
        style="margin:0"
        onclick="openCategoryModal()">
        + Category
      </button>

    </div>

  </div>


  <!-- CATEGORY FILTER -->

  <div class="category-row" id="categoryFilters">
    <button class="category-btn active" onclick="filterCategory('all',this)">
      All
    </button>
  </div>


  <!-- TASKS -->

  <div class="tasks" id="tasks"></div>

</div>
</section>


<!-- TARGET MODAL -->

<div class="modal" id="targetModal">
  <div class="modal-card">

    <h2>🎯 Set Targets</h2>

    <div class="field">
      <label>Daily target</label>
      <input id="dailyInput" type="number" min="1">
    </div>

    <div class="field">
      <label>Weekly target</label>
      <input id="weeklyInput" type="number" min="1">
    </div>

    <div class="modal-buttons">
      <button class="cancel" onclick="closeTargetModal()">Cancel</button>
      <button class="save" onclick="saveTargets()">Save</button>
    </div>

  </div>
</div>


<!-- CATEGORY MODAL -->

<div class="modal" id="categoryModal">
  <div class="modal-card">

    <h2>🗂️ New Category</h2>

    <div class="field">
      <input id="categoryInput" placeholder="Category name">
    </div>

    <div class="field">
      <label>Color</label>
      <input id="categoryColor" type="color" value="#6366f1">
    </div>

    <div class="modal-buttons">
      <button class="cancel" onclick="closeCategoryModal()">Cancel</button>
      <button class="save" onclick="createCategory()">Create</button>
    </div>

  </div>
</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://ycjpxtefvdsiwsfofwzw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ib0-yOUVBd1FAEWoRpaCGw_mmvHd-bd";

const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user = null;
let currentListId = null;
let tasks = [];
let categories = [];
let currentFilter = "all";
let targets = {
  daily_target: 5,
  weekly_target: 30
};


/* =========================
   AUTH
========================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("authMessage");

  message.textContent = "Logging in...";

  const { data, error } =
    await client.auth.signInWithPassword({
      email,
      password
    });

  if(error) {
    message.textContent = error.message;
    return;
  }

  user = data.user;

  await startApp();
}


async function signup() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("authMessage");

  message.textContent = "Creating account...";

  const { data, error } =
    await client.auth.signUp({
      email,
      password
    });

  if(error) {
    message.textContent = error.message;
    return;
  }

  if(!data.session) {
    message.textContent =
      "Account created! Check your email to confirm your account.";
    return;
  }

  user = data.user;

  await startApp();
}


async function logout() {

  await client.auth.signOut();

  user = null;

  document.getElementById("app").style.display = "none";
  document.getElementById("auth").style.display = "flex";
}


/* =========================
   START APP
========================= */

async function startApp() {

  document.getElementById("auth").style.display = "none";
  document.getElementById("app").style.display = "block";

  await loadCurrentList();
  await loadCategories();
  await loadTargets();
  async function loadCurrentList() {

  const { data, error } =
    await client
      .from("lists")
      .select("*")
      .eq("user_id", user.id)
      .order("created_at", { ascending: true })
      .limit(1)
      .maybeSingle();

  if (error) {
    console.error(error);
    return;
  }

  if (data) {

    currentListId = data.id;

  } else {

    const { data: newList, error: createError } =
      await client
        .from("lists")
        .insert({
          user_id: user.id,
          name: "My Tasks"
        })
        .select()
        .single();

    if (createError) {
      console.error(createError);
      return;
    }

    currentListId = newList.id;
  }
  }
  await loadTasks();

}

/* =========================
   TASKS
========================= */

async function loadTasks() {

  const { data, error } =
    await client
      .from("tasks")
      .select("*")
      .eq("user_id", user.id)
      .order("created_at", { ascending: false });

  if(error) {
    console.error(error);
    return;
  }

  tasks = data || [];

  renderTasks();
  updateDashboard();
}


async function addTask() {

  const input =
    document.getElementById("taskInput");

  const title = input.value.trim();

  if(!title) return;

  const categoryId =
    document.getElementById("categorySelect").value || null;

  const { error } =
    await client
       .from("tasks")
       .insert({
        user_id: user.id,
        list_id: currentListId,
        title: title,
        completed: false,
        category_id: categoryId
       });

  if(error) {
    alert(error.message);
    return;
  }

  input.value = "";

  await loadTasks();
}


async function toggleTask(id, completed) {
  const { error } = await client
    .from("tasks")
    .update({
      completed: completed,
      completed_at: completed ? new Date().toISOString() : null
    })
    .eq("id", id)
    .eq("user_id", user.id);

  if (error) {
    console.error(error);
    alert("Could not update task");
    return;
  }

  await loadTasks();
  renderTasks();
  updateDashboard();
  }


async function deleteTask(id) {

  const { error } =
    await client
      .from("tasks")
      .delete()
      .eq("id", id)
      .eq("user_id", user.id);

  if(error) {
    alert(error.message);
    return;
  }

  await loadTasks();
}


/* =========================
   RENDER TASKS
========================= */

function renderTasks() {

  const container =
    document.getElementById("tasks");

  let filtered = tasks;

  if(currentFilter !== "all") {

    filtered =
      tasks.filter(
        t => t.category_id === currentFilter
      );

  }

  if(filtered.length === 0) {

    container.innerHTML = `
      <div class="empty">
        <div style="font-size:40px">✨</div>
        <p>No tasks here yet.</p>
      </div>
    `;

    return;
  }

  container.innerHTML =
    filtered.map(task => {

      const category =
        categories.find(
          c => c.id === task.category_id
        );

      return `
        <div class="task ${task.completed ? "done" : ""}">

          <button
            class="check"
            onclick="toggleTask('${task.id}', ${task.completed})">
          </button>

          <div class="task-title">
            ${escapeHtml(task.title)}
          </div>

          ${
            category
            ?
            `<span
              class="category-tag"
              style="background:${category.color}22;color:${category.color}">
              ${escapeHtml(category.name)}
            </span>`
            : ""
          }

          <button
            class="delete"
            onclick="deleteTask('${task.id}')">
            ×
          </button>

        </div>
      `;

    }).join("");
}


/* =========================
   DASHBOARD
========================= */

function updateDashboard() {

  const total = tasks.length;

  const completed =
    tasks.filter(t => t.completed).length;

  const overall =
    total === 0
      ? 0
      : Math.round((completed / total) * 100);

  document.getElementById("finishedText")
    .textContent =
    `${completed} / ${total}`;

  document.getElementById("overallPercent")
    .textContent =
    `${overall}%`;

  setTimeout(() => {

    document.getElementById("overallBar")
      .style.width = `${overall}%`;

    const streakElement = document.getElementById("streakCount");

if (streakElement) {
  streakElement.textContent = calculateStreak();
}
    
  }, 50);

  function calculateStreak() {
  if (!tasks.length) return 0;

  const completedDates = new Set();

  tasks.forEach(task => {
    if (task.completed && task.completed_at) {
      const date = new Date(task.completed_at);

      const dateKey =
        date.getFullYear() + "-" +
        String(date.getMonth() + 1).padStart(2, "0") + "-" +
        String(date.getDate()).padStart(2, "0");

      completedDates.add(dateKey);
    }
  });

  let streak = 0;
  const today = new Date();

  for (let i = 0; ; i++) {
    const date = new Date(today);
    date.setDate(today.getDate() - i);

    const dateKey =
      date.getFullYear() + "-" +
      String(date.getMonth() + 1).padStart(2, "0") + "-" +
      String(date.getDate()).padStart(2, "0");

    if (completedDates.has(dateKey)) {
      streak++;
    } else {
      break;
    }
  }

  return streak;
  }

  /* DAILY */

  const now = new Date();

  const daily =
    tasks.filter(task => {

      if(!task.completed) return false;

      const date =
        new Date(task.created_at);

      return date.toDateString() ===
             now.toDateString();

    }).length;


  const dailyPercent =
    Math.min(
      100,
      Math.round(
        daily / targets.daily_target * 100
      )
    );


  document.getElementById("dailyProgress")
    .textContent = daily;

  document.getElementById("dailyTarget")
    .textContent = targets.daily_target;

  document.getElementById("dailyBar")
    .style.width =
    `${dailyPercent}%`;


  /* WEEKLY */

  const start =
    new Date(now);

  const day =
    start.getDay();

  const difference =
    day === 0 ? 6 : day - 1;

  start.setDate(
    start.getDate() - difference
  );

  start.setHours(0,0,0,0);


  const weekly =
    tasks.filter(task => {

      if(!task.completed) return false;

      return new Date(task.created_at) >= start;

    }).length;


  const weeklyPercent =
    Math.min(
      100,
      Math.round(
        weekly / targets.weekly_target * 100
      )
    );


  document.getElementById("weeklyProgress")
    .textContent = weekly;

  document.getElementById("weeklyTarget")
    .textContent = targets.weekly_target;

  document.getElementById("weeklyBar")
    .style.width =
    `${weeklyPercent}%`;
}


/* =========================
   TARGETS
========================= */

async function loadTargets() {

  const { data, error } =
    await client
      .from("targets")
      .select("*")
      .eq("user_id", user.id)
      .maybeSingle();

  if(error) {
    console.error(error);
    return;
  }

  if(data) {

    targets = data;

  } else {

    const { data: newTarget } =
      await client
        .from("targets")
        .insert({
          user_id: user.id,
          daily_target: 5,
          weekly_target: 30
        })
        .select()
        .single();

    if(newTarget) {
      targets = newTarget;
    }

  }
}


function openTargetModal() {

  document.getElementById("dailyInput").value =
    targets.daily_target;

  document.getElementById("weeklyInput").value =
    targets.weekly_target;

  document.getElementById("targetModal")
    .style.display = "flex";
}


function closeTargetModal() {

  document.getElementById("targetModal")
    .style.display = "none";
}


async function saveTargets() {

  const daily =
    Number(
      document.getElementById("dailyInput").value
    );

  const weekly =
    Number(
      document.getElementById("weeklyInput").value
    );

  if(daily < 1 || weekly < 1) return;

  const { data, error } =
    await client
      .from("targets")
      .update({
        daily_target: daily,
        weekly_target: weekly
      })
      .eq("user_id", user.id)
      .select()
      .single();

  if(error) {

    alert(error.message);
    return;

  }

  targets = data;

  closeTargetModal();

  updateDashboard();
}

/* =========================
   CATEGORIES
========================= */

async function loadCategories() {

  const { data, error } =
    await client
      .from("categories")
      .select("*")
      .eq("user_id", user.id)
      .order("created_at");

  if (error) {
    console.error(error);
    return;
  }

  categories = data || [];

  renderCategoryOptions();
  renderCategoryFilters();
}


function renderCategoryOptions() {

  const select =
    document.getElementById("categorySelect");

  select.innerHTML =
    `<option value="">No category</option>`;

  categories.forEach(category => {

    select.innerHTML += `
      <option value="${category.id}">
        ${escapeHtml(category.name)}
      </option>
    `;

  });
}


function renderCategoryFilters() {

  const container =
    document.getElementById("categoryFilters");

  container.innerHTML = `
    <button
      class="category-btn ${currentFilter === "all" ? "active" : ""}"
      onclick="filterCategory('all',this)">
      All
    </button>
  `;

  categories.forEach(category => {

    container.innerHTML += `
      <button
        class="category-btn ${currentFilter === category.id ? "active" : ""}"
        onclick="filterCategory('${category.id}',this)">
        ${escapeHtml(category.name)}
      </button>
    `;

  });
}


function filterCategory(id, button) {

  currentFilter = id;

  document.querySelectorAll(".category-btn")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  renderTasks();
}


function openCategoryModal() {

  document.getElementById("categoryInput").value = "";

  document.getElementById("categoryModal")
    .style.display = "flex";
}


function closeCategoryModal() {

  document.getElementById("categoryModal")
    .style.display = "none";
}


async function createCategory() {

  const name =
    document.getElementById("categoryInput")
      .value.trim();

  const color =
    document.getElementById("categoryColor").value;

  if (!name) return;

  const { error } =
    await client
      .from("categories")
      .insert({
        user_id: user.id,
        name: name,
        color: color
      });

  if (error) {
    alert(error.message);
    return;
  }

  closeCategoryModal();

  await loadCategories();
}


/* =========================
   SECURITY
========================= */

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================
   ENTER KEY
========================= */

document
  .getElementById("taskInput")
  .addEventListener("keydown", e => {

    if (e.key === "Enter") {
      addTask();
    }

  });


/* =========================
   EXISTING SESSION
========================= */

async function checkSession() {

  const { data } =
    await client.auth.getSession();

  if (data.session) {

    user = data.session.user;

    await startApp();

  }

}

checkSession();

</script>

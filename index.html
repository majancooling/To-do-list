<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg:#08090d;
  --panel:#11131a;
  --panel2:#171923;
  --border:rgba(255,255,255,.09);
  --text:#f5f7ff;
  --muted:#969bad;
  --accent:#7c5cff;
  --green:#24d6a5;
  --red:#ff5d73;
}

body {
  min-height:100vh;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 10% 10%,rgba(124,92,255,.2),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(36,214,165,.12),transparent 30%),
    var(--bg);
  color:var(--text);
}

button,input {
  font:inherit;
}

button {
  cursor:pointer;
}

.hidden {
  display:none!important;
}

/* AUTH */

.auth {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-card {
  width:100%;
  max-width:430px;
  padding:32px;
  border:1px solid var(--border);
  border-radius:24px;
  background:rgba(17,19,26,.85);
  backdrop-filter:blur(20px);
  box-shadow:0 25px 80px rgba(0,0,0,.4);
}

.logo {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:25px;
  font-weight:800;
  margin-bottom:10px;
}

.logo-icon {
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7c5cff,#b36cff);
}

.auth-subtitle {
  color:var(--muted);
  margin-bottom:28px;
}

.auth-card h2 {
  margin-bottom:18px;
}

.input {
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#0b0d12;
  color:white;
  outline:none;
}

.input:focus {
  border-color:var(--accent);
}

.primary {
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  color:white;
  font-weight:700;
  background:linear-gradient(135deg,#7c5cff,#9d62ff);
}

.switch {
  margin-top:18px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.switch span {
  color:#a995ff;
  cursor:pointer;
  font-weight:700;
}

.message {
  margin-bottom:14px;
  padding:11px;
  border-radius:10px;
  background:rgba(255,93,115,.1);
  color:#ff9aaa;
  font-size:13px;
}

/* APP */

.app {
  min-height:100vh;
}

.topbar {
  height:72px;
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:rgba(8,9,13,.75);
  backdrop-filter:blur(20px);
  position:sticky;
  top:0;
  z-index:10;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:20px;
}

.brand-icon {
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7c5cff,#b36cff);
}

.user-area {
  display:flex;
  align-items:center;
  gap:12px;
}

.user-email {
  color:var(--muted);
  font-size:13px;
}

.logout {
  padding:9px 13px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  color:white;
}

.layout {
  display:grid;
  grid-template-columns:240px 1fr;
  min-height:calc(100vh - 72px);
}

/* SIDEBAR */

.sidebar {
  padding:22px 16px;
  border-right:1px solid var(--border);
}

.sidebar-title {
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin:10px 10px;
}

.list-button {
  width:100%;
  padding:12px;
  margin-bottom:6px;
  border:0;
  border-radius:11px;
  text-align:left;
  background:transparent;
  color:var(--muted);
}

.list-button:hover,
.list-button.active {
  background:rgba(124,92,255,.15);
  color:white;
}

.new-list {
  width:100%;
  margin-top:10px;
  padding:11px;
  border:1px dashed #4c456c;
  border-radius:11px;
  background:transparent;
  color:#a995ff;
}

/* CONTENT */

.content {
  padding:30px;
  max-width:1100px;
  width:100%;
}

.heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  gap:15px;
}

.heading h1 {
  font-size:32px;
}

.heading p {
  color:var(--muted);
  margin-top:5px;
}

.add-task {
  padding:12px 18px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#7c5cff,#9d62ff);
  color:white;
  font-weight:700;
}

/* STATS */

.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:22px;
}

.stat {
  padding:18px;
  border:1px solid var(--border);
  border-radius:16px;
  background:rgba(255,255,255,.04);
}

.stat small {
  color:var(--muted);
}

.stat strong {
  display:block;
  font-size:27px;
  margin-top:5px;
}

/* TASKS */

.task-panel {
  padding:22px;
  border:1px solid var(--border);
  border-radius:20px;
  background:rgba(255,255,255,.04);
}

.task {
  display:flex;
  align-items:center;
  gap:13px;
  padding:15px 5px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.task:last-child {
  border-bottom:0;
}

.check {
  width:21px;
  height:21px;
  border:2px solid #626779;
  border-radius:6px;
  flex-shrink:0;
  cursor:pointer;
}

.task.completed .check {
  background:var(--green);
  border-color:var(--green);
}

.task.completed .check::after {
  content:"✓";
  color:#06120e;
  font-size:13px;
  font-weight:900;
  margin-left:3px;
}

.task-title {
  flex:1;
  font-size:15px;
}

.task.completed .task-title {
  text-decoration:line-through;
  color:#717687;
}

.delete {
  border:0;
  background:transparent;
  color:#777b8c;
  font-size:18px;
}

.delete:hover {
  color:var(--red);
}

.empty {
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
}

/* MOBILE */

@media(max-width:700px) {

  .topbar {
    padding:0 15px;
  }

  .user-email {
    display:none;
  }

  .layout {
    display:block;
  }

  .sidebar {
    border-right:0;
    border-bottom:1px solid var(--border);
    padding:12px;
    display:flex;
    gap:6px;
    overflow-x:auto;
  }

  .sidebar-title,
  .new-list {
    display:none;
  }

  .list-button {
    min-width:max-content;
    width:auto;
    margin:0;
  }

  .content {
    padding:20px 15px 40px;
  }

  .heading {
    align-items:flex-start;
  }

  .heading h1 {
    font-size:26px;
  }

  .stats {
    grid-template-columns:repeat(3,1fr);
  }

  .stat {
    padding:13px;
  }

  .stat strong {
    font-size:21px;
  }

  .stat small {
    font-size:11px;
  }
}

@media(max-width:430px) {

  .heading {
    display:block;
  }

  .add-task {
    width:100%;
    margin-top:15px;
  }

  .stats {
    gap:7px;
  }
}
</style>
</head>

<body>

<!-- LOGIN / SIGNUP -->

<section id="authScreen" class="auth">

  <div class="auth-card">

    <div class="logo">
      <div class="logo-icon">✓</div>
      TaskFlow
    </div>

    <p class="auth-subtitle">
      Organize your tasks. Stay productive.
    </p>

    <div id="authMessage" class="message hidden"></div>

    <div id="loginBox">

      <h2>Welcome back</h2>

      <input
        id="loginEmail"
        class="input"
        type="email"
        placeholder="Email"
      >

      <input
        id="loginPassword"
        class="input"
        type="password"
        placeholder="Password"
      >

      <button id="loginBtn" class="primary">
        Log in
      </button>

      <div class="switch">
        Don't have an account?
        <span onclick="showSignup()">Create one</span>
      </div>

    </div>

    <div id="signupBox" class="hidden">

      <h2>Create account</h2>

      <input
        id="signupEmail"
        class="input"
        type="email"
        placeholder="Email"
      >

      <input
        id="signupPassword"
        class="input"
        type="password"
        placeholder="Password"
      >

      <button id="signupBtn" class="primary">
        Create account
      </button>

      <div class="switch">
        Already have an account?
        <span onclick="showLogin()">Log in</span>
      </div>

    </div>

  </div>

</section>


<!-- MAIN APP -->

<section id="appScreen" class="app hidden">

  <header class="topbar">

    <div class="brand">
      <div class="brand-icon">✓</div>
      TaskFlow
    </div>

    <div class="user-area">

      <span id="userEmail" class="user-email"></span>

      <button id="logoutBtn" class="logout">
        Logout
      </button>

    </div>

  </header>


  <div class="layout">

    <aside class="sidebar">

      <div class="sidebar-title">
        My Lists
      </div>

      <div id="listsContainer"></div>

      <button id="newListBtn" class="new-list">
        ＋ New List
      </button>

    </aside>


    <main class="content">

      <div class="heading">

        <div>
          <h1 id="listTitle">My Tasks</h1>
          <p>Stay organized and get things done.</p>
        </div>

        <button id="addTaskBtn" class="add-task">
          ＋ Add Task
        </button>

      </div>


      <div class="stats">

        <div class="stat">
          <small>Total</small>
          <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
          <small>Completed</small>
          <strong id="completedCount">0</strong>
        </div>

        <div class="stat">
          <small>Remaining</small>
          <strong id="remainingCount">0</strong>
        </div>

      </div>


      <div class="task-panel">

        <div id="tasksContainer"></div>

      </div>

    </main>

  </div>

</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ============================
   SUPABASE
============================ */

const SUPABASE_URL =
  "https://ycjpxtefvdsiwsfofwzw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Ib0-yOUVBd1FAEWoRpaCGw_mmvHd-bd";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ============================
   VARIABLES
============================ */

let currentUser = null;
let currentList = null;
let lists = [];
let tasks = [];


/* ============================
   ELEMENTS
============================ */

const authScreen =
  document.getElementById("authScreen");

const appScreen =
  document.getElementById("appScreen");

const authMessage =
  document.getElementById("authMessage");


/* ============================
   AUTH UI
============================ */

function showMessage(message) {

  authMessage.textContent = message;
  authMessage.classList.remove("hidden");

}

function clearMessage() {

  authMessage.classList.add("hidden");

}

function showSignup() {

  clearMessage();

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("signupBox")
    .classList.remove("hidden");

}

function showLogin() {

  clearMessage();

  document
    .getElementById("signupBox")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

}


/* ============================
   SIGN UP
============================ */

document
  .getElementById("signupBtn")
  .addEventListener("click", async () => {

    const email =
      document.getElementById("signupEmail").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    if (!email || !password) {

      showMessage("Enter an email and password.");

      return;
    }

    if (password.length < 6) {

      showMessage("Password must be at least 6 characters.");

      return;
    }

    const {
      data,
      error
    } = await supabaseClient.auth.signUp({
      email,
      password
    });

    if (error) {

      showMessage(error.message);

      return;
    }

    if (data.session) {

      await startApp(data.session.user);

    } else {

      showMessage(
        "Account created! Check your email to confirm your account, then log in."
      );

    }

  });


/* ============================
   LOGIN
============================ */

document
  .getElementById("loginBtn")
  .addEventListener("click", async () => {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    if (!email || !password) {

      showMessage("Enter your email and password.");

      return;
    }

    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {

      showMessage(error.message);

      return;
    }

    await startApp(data.user);

  });


/* ============================
   LOGOUT
============================ */

document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentList = null;

    appScreen.classList.add("hidden");
    authScreen.classList.remove("hidden");

    showLogin();

  });


/* ============================
   START APP
============================ */

async function startApp(user) {

  currentUser = user;

  authScreen.classList.add("hidden");
  appScreen.classList.remove("hidden");

  document.getElementById("userEmail").textContent =
    user.email;

  await loadLists();

}


/* ============================
   LOAD LISTS
============================ */

async function loadLists() {

  const {
    data,
    error
  } = await supabaseClient
    .from("lists")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", {
      ascending:true
    });

  if (error) {

    alert(error.message);

    return;
  }

  lists = data || [];

  if (lists.length === 0) {

    const {
      data:newList,
      error:createError
    } = await supabaseClient
      .from("lists")
      .insert({
        user_id:currentUser.id,
        name:"My Tasks"
      })
      .select()
      .single();

    if (createError) {

      alert(createError.message);

      return;
    }

    lists = [newList];

  }

  currentList = currentList &&
    lists.find(x => x.id === currentList.id)
      ? lists.find(x => x.id === currentList.id)
      : lists[0];

  renderLists();

  await loadTasks();

}


/* ============================
   RENDER LISTS
============================ */

function renderLists() {

  const container =
    document.getElementById("listsContainer");

  container.innerHTML = "";

  lists.forEach(list => {

    const button =
      document.createElement("button");

    button.className =
      "list-button " +
      (currentList &&
       currentList.id === list.id
        ? "active"
        : "");

    button.textContent =
      "📁 " + list.name;

    button.onclick = async () => {

      currentList = list;

      renderLists();

      await loadTasks();

    };

    container.appendChild(button);

  });

}


/* ============================
   CREATE LIST
============================ */

document
  .getElementById("newListBtn")
  .addEventListener("click", async () => {

    const name =
      prompt("Enter a name for your new list:");

    if (!name || !name.trim()) return;

    const {
      data,
      error
    } = await supabaseClient
      .from("lists")
      .insert({
        user_id:currentUser.id,
        name:name.trim()
      })
      .select()
      .single();

    if (error) {

      alert(error.message);

      return;
    }

    lists.push(data);

    currentList = data;

    renderLists();

    await loadTasks();

  });


/* ============================
   LOAD TASKS
============================ */

async function loadTasks() {

  if (!currentList) return;

  document.getElementById("listTitle")
    .textContent = currentList.name;

  const {
    data,
    error
  } = await supabaseClient
    .from("tasks")
    .select("*")
    .eq("user_id", currentUser.id)
    .eq("list_id", currentList.id)
    .order("created_at", {
      ascending:true
    });

  if (error) {

    alert(error.message);

    return;
  }

  tasks = data || [];

  renderTasks();

}


/* ============================
   RENDER TASKS
============================ */

function renderTasks() {

  const container =
    document.getElementById("tasksContainer");

  container.innerHTML = "";

  if (tasks.length === 0) {

    container.innerHTML = `
      <div class="empty">
        <div style="font-size:35px;margin-bottom:10px;">
          ✨
        </div>
        No tasks yet.<br>
        Add your first task!
      </div>
    `;

  }

  tasks.forEach(task => {

    const row =
      document.createElement("div");

    row.className =
      "task " +
      (task.completed ? "completed" : "");

    row.innerHTML = `
      <div class="check"></div>

      <div class="task-title">
        ${escapeHTML(task.title)}
      </div>

      <button class="delete">
        🗑️
      </button>
    `;

    row
      .querySelector(".check")
      .onclick = () =>
        toggleTask(task);

    row
      .querySelector(".delete")
      .onclick = () =>
        deleteTask(task);

    container.appendChild(row);

  });


  updateStats();

}


/* ============================
   ADD TASK
============================ */

document
  .getElementById("addTaskBtn")
  .addEventListener("click", async () => {

    if (!currentList) return;

    const title =
      prompt("What do you need to do?");

    if (!title || !title.trim()) return;

    const {
      data,
      error
    } = await supabaseClient
      .from("tasks")
      .insert({
        user_id:currentUser.id,
        list_id:currentList.id,
        title:title.trim(),
        completed:false
      })
      .select()
      .single();

    if (error) {

      alert(error.message);

      return;
    }

    tasks.push(data);

    renderTasks();

  });


/* ============================
   COMPLETE TASK
============================ */

async function toggleTask(task) {

  const {
    data,
    error
  } = await supabaseClient
    .from("tasks")
    .update({
      completed:!task.completed
    })
    .eq("id",task.id)
    .eq("user_id",currentUser.id)
    .select()
    .single();

  if (error) {

    alert(error.message);

    return;
  }

  const index =
    tasks.findIndex(x => x.id === task.id);

  if (index !== -1) {

    tasks[index] = data;

  }

  renderTasks();

}


/* ============================
   DELETE TASK
============================ */

async function deleteTask(task) {

  const confirmed =
    confirm("Delete this task?");

  if (!confirmed) return;

  const {
    error
  } = await supabaseClient
    .from("tasks")
    .delete()
    .eq("id",task.id)
    .eq("user_id",currentUser.id);

  if (error) {

    alert(error.message);

    return;
  }

  tasks =
    tasks.filter(x => x.id !== task.id);

  renderTasks();

}


/* ============================
   STATISTICS
============================ */

function updateStats() {

  const total = tasks.length;

  const completed =
    tasks.filter(x => x.completed).length;

  const remaining =
    total - completed;

  document.getElementById("totalCount")
    .textContent = total;

  document.getElementById("completedCount")
    .textContent = completed;

  document.getElementById("remainingCount")
    .textContent = remaining;

}


/* ============================
   SECURITY
============================ */

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent = value;

  return div.innerHTML;

}


/* ============================
   CHECK EXISTING SESSION
============================ */

async function checkSession() {

  const {
    data
  } = await supabaseClient.auth.getSession();

  if (data.session) {

    await startApp(data.session.user);

  }

}


/* ============================
   AUTH STATE
============================ */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if (session && !currentUser) {

      await startApp(session.user);

    }

  }
);


/* START */

checkSession();

</script>

</body>
  </html>
